<html lang="lt">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cecho planas</title>
<script src="/hub/shared/gate.js"></script>
<link rel="icon" type="image/png" href="https://gervdalius-droid.github.io/hub/shared/favicon-64.png">
<link rel="apple-touch-icon" href="https://gervdalius-droid.github.io/hub/shared/touch-180.png">
<script>try{var t=localStorage.getItem('hub-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one screen. Slim header strip, floor plan drawn to scale (1 unit = 1 cm) filling the left, roster/inspector rail on the right. */
:root{
  --bg:#e6e8e2; --floor:#d3d7cf; --grid:#c3c8bf; --wall:#2a322d; --panel:#f3f4ef; --line:#c2c7be;
  --ink:#1b221e; --muted:#59645d; --mline:#262d29; --booth:#e4e6df;
  --mark:#f0b400; --mark-ink:#231a00;
  --run:#17924b; --idle:#6f7b86; --down:#d23f2c; --busy:#2267c9;
  --person:#1b221e; --person-ink:#f3f4ef;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131718; --floor:#20262a; --grid:#2b3236; --wall:#cdd5d0; --panel:#1b2023; --line:#353d41;
  --ink:#e9edea; --muted:#9ba7a1; --mline:#0b0e0f; --booth:#2a3135;
  --mark:#f5bd1f; --mark-ink:#231a00;
  --run:#35c274; --idle:#8d99a4; --down:#f0624f; --busy:#5d9bf0;
  --person:#e9edea; --person-ink:#131718; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131718; --floor:#20262a; --grid:#2b3236; --wall:#cdd5d0; --panel:#1b2023; --line:#353d41;
  --ink:#e9edea; --muted:#9ba7a1; --mline:#0b0e0f; --booth:#2a3135;
  --mark:#f5bd1f; --mark-ink:#231a00;
  --run:#35c274; --idle:#8d99a4; --down:#f0624f; --busy:#5d9bf0;
  --person:#e9edea; --person-ink:#131718; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  display:flex;flex-direction:column;gap:10px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--display);font-size:19px;font-weight:600}
.counts span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.d-run{background:var(--run)}.d-idle{background:var(--idle)}.d-down{background:var(--down)}.d-ppl{background:var(--person)}.d-inst{background:var(--mark)}
.sp{flex:1}
.clock{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.sync{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
.mapwrap{min-width:0;min-height:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#map{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#three{position:absolute;inset:0;touch-action:none}
#three canvas{display:block;width:100%;height:100%}
.hint3{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 8px;pointer-events:none}
body.tv .hint3{display:none}
.rail{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.pickbar{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.pickbar .btn{background:transparent;border-color:var(--mark-ink);color:var(--mark-ink)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stbtn{flex:1;min-width:84px;border:2px solid var(--line);background:transparent;border-radius:6px;padding:9px 6px;font-family:var(--display);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.stbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.pbtn{background:none;border:0;padding:2px 0;text-align:left;font-weight:600;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.pbtn:hover{text-decoration:underline}
.where{color:var(--muted);font-size:14px;text-align:right;overflow-wrap:anywhere}
.where.on{color:var(--ink)}
.x{background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;color:var(--muted)}
.x:hover{border-color:var(--down);color:var(--down)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input.grow{flex:1}
input.q{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-height:110px;resize:vertical}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column}
.badge{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px}
.chk label{display:inline-flex;gap:5px;align-items:center}
.wl{display:grid;grid-template-columns:1fr 80px auto;gap:6px;align-items:center}
.pickbar input{background:var(--panel);border-color:var(--mark-ink);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:5;max-width:90%}

/* map drawing */
.it{cursor:pointer}
.it .hit{fill:transparent;stroke:transparent;stroke-width:5}
.it:hover .hit{stroke:var(--muted);stroke-dasharray:14 10}
.it.sel .hit{stroke:var(--mark);stroke-dasharray:none;stroke-width:8}
.editing .it{cursor:grab}
.picking .it .hit{stroke:var(--mark);stroke-dasharray:14 10}
.lbl{font-family:var(--display);font-weight:700;font-size:34px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--floor);stroke-width:9px;stroke-linejoin:round}
.stt{font-family:var(--display);font-weight:600;font-size:27px;text-anchor:middle;letter-spacing:.04em;paint-order:stroke;stroke:var(--floor);stroke-width:8px;stroke-linejoin:round}
.s-run{fill:var(--run)}.s-idle{fill:var(--idle)}.s-down{fill:var(--down)}.s-busy{fill:var(--busy)}
.pill rect{fill:var(--person)}
.pill text{fill:var(--person-ink);font-family:var(--display);font-weight:600;font-size:29px;text-anchor:middle}
.pill{cursor:pointer}
.pill.sel rect{fill:var(--mark)}.pill.sel text{fill:var(--mark-ink)}
.dim{font-family:var(--display);font-size:24px;fill:var(--muted)}
.elbl{font-family:var(--display);font-weight:700;font-size:28px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:9px;stroke-linejoin:round;pointer-events:none}
.vh{fill:var(--mark);stroke:var(--mark-ink);stroke-width:4;cursor:move}
.vadd{cursor:pointer}.vadd circle{fill:var(--panel);stroke:var(--ink);stroke-width:3}.vadd text{font-family:var(--body);font-weight:600;font-size:26px;text-anchor:middle;fill:var(--ink);pointer-events:none}
.pill text.pp{font-size:22px;font-weight:500}
.down .draw{opacity:.55}
.run .beacon{animation:pulse 1.4s ease-in-out infinite}
.run .mv-slide{animation:slide 4s ease-in-out infinite alternate}
.run .mv-feed{animation:feed 6s linear infinite}
.run .mv-gantry{animation:gantry 6s ease-in-out infinite alternate}
.run .mv-laser{animation:laser 2.2s ease-in-out infinite alternate}
.run .mv-spin{animation:spin 1.3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.25}}
@keyframes slide{from{transform:translateX(-45px)}to{transform:translateX(45px)}}
@keyframes feed{from{transform:translateX(-170px)}to{transform:translateX(160px)}}
@keyframes gantry{from{transform:translateX(-135px)}to{transform:translateX(105px)}}
@keyframes laser{from{transform:translateY(-32px)}to{transform:translateY(32px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.run .mv,.run .beacon{animation:none}}

/* TV mode: nothing to operate, just read */
body.tv .edit-only,body.tv #btnEdit,body.tv .sync{display:none}
body.tv main{grid-template-columns:minmax(0,1fr) 360px}
body.tv .rail{font-size:19px}
body.tv .pbtn{font-size:22px}
body.tv .where{font-size:18px}
body.tv h1{font-size:32px}.tv .counts{font-size:24px}.tv .clock{font-size:34px}

@media (max-width:820px){
  html,body{height:auto}
  main{display:flex;flex-direction:column}
  .mapwrap{overflow-x:auto}
  .mapwrap.v3{height:460px;overflow:hidden}
  #map{min-width:860px;height:auto}
  body.tv main{display:flex}
}

a.btn{text-decoration:none;display:inline-block}
</style>
</head>
<body>

  <div class="counts" id="counts"></div>
  <span class="sp"></span>
  <span class="sync" id="sync"></span>
  <div class="tools">
    <a class="btn" id="btnHub" href="../shopfloor/">← Hub</a>
    <button class="btn" id="btnAuth" type="button" hidden></button>
    <button class="btn" id="btnView" type="button"></button>
    <button class="btn" id="btnLang" type="button"></button>
    <button class="btn" id="btnEdit" type="button" aria-pressed="false"></button>
    <button class="btn" id="btnTv" type="button" aria-pressed="false"></button>
  </div>
  <span class="clock" id="clock"></span>
</header>
<main>
  <div class="mapwrap" id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg><div id="three" hidden></div><div class="hint3" id="hint3" hidden></div></div>
  <aside class="rail" id="rail"></aside>
</main>
<div id="toast" hidden></div>

<script src="../workers/workshop-auth.js"></script>

function normalize(){
  const l=LAY(); if(!isObj(l.hall))l.hall=clone(DEF_LAYOUT.hall); if(!isObj(l.items))l.items={};
  const s=ST(); for(const k of ['st','people','stock','inst'])if(!isObj(s[k]))s[k]={};
  if(!Array.isArray(s.projects))s.projects=[];

function canWrite(){
  if(readOnly){toast(t('ro'));return false}

/* ---------- storage ----------
   The plan lives in the workshop database beside ShopFlow: table "workspaces", row "dedes-cechas",
   data = {layout, state}. Every change is applied to the newest server copy before it is written
   back, so the TV, the office PC and a phone do not overwrite each other. A copy is also kept in
   this browser, so the page still opens without a connection or a sign-in. */
const ROW='dedes-cechas', SF_ROW='dedes-baldai', WA=window.WorkshopAuth||null;
let pend=[], flushing=false, flushT=null, lastT=0, who='cechas', saveErr='';
const SF={orders:[],members:[],at:0,err:false};
let timersOn=false;
function commit(d,patch,whole){
  if(patch)merge(d.data,patch);
  render();
  lsSet('cp.'+d.key,JSON.stringify(d.data));
  if(mode!=='db')return;
  pend.push({k:d.key,patch:patch&&!whole?clone(patch):null});
  clearTimeout(flushT);flushT=setTimeout(flush,350);
}
async function pullRow(){const rows=await WA.rest('workspaces?id=eq.'+ROW+'&select=data,updated_at');return(rows&&rows[0])||null}
function applyRow(row){
  if(!row||!isObj(row.data))return;
  lastT=Date.parse(row.updated_at)||0;
  for(const k in docs)if(isObj(row.data[k])){docs[k].data=clone(row.data[k]);lsSet('cp.'+k,JSON.stringify(docs[k].data))}
  normalize();
}
async function flush(){
  if(flushing||!pend.length||mode!=='db')return;
  flushing=true;const batch=pend;pend=[];
  try{
    const row=await pullRow(),base=(row&&isObj(row.data))?row.data:{};
    for(const k in docs)if(!isObj(base[k]))base[k]=clone(docs[k].data);
    for(const p of batch){if(p.patch)merge(base[p.k],p.patch);else base[p.k]=clone(docs[p.k].data)}
    const stamp=new Date().toISOString();
    await WA.rest('workspaces',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:ROW,data:base,updated_at:stamp,updated_by:who})});
    saveErr='';stale=false;
    if(!pend.length){applyRow({data:base,updated_at:stamp});if(!drag&&!busy3)render()}
  }catch(e){
    pend=batch.concat(pend);
    if(e&&(e.status===401||e.status===403||e.status===404)){saveErr=t('noSave');pend=[];mode='local';toast(saveErr)}else stale=true;
  }
  flushing=false;renderHeader();
  if(pend.length&&!stale)flush();
}
async function poll(){
  if(mode!=='db'||document.hidden||flushing)return;
  if(pend.length){flush();return}
  try{
    const row=await pullRow();
    for(const k in docs)docs[k].loaded=true;
    stale=false;
    if(row&&!pend.length&&!flushing&&(Date.parse(row.updated_at)||0)!==lastT){applyRow(row);if(!drag&&!busy3)render()}
  }catch(e){if(e&&e.status===401){mode='local'}else stale=true}
  renderHeader();
}
/* projects and worker names straight from ShopFlow's own row: only orders that are not shipped or archived */
async function loadShopflow(manual){
  if(mode!=='db')return;
  try{
    const rows=await WA.rest('workspaces?id=eq.'+SF_ROW+'&select=orders:data->orders,members:data->members'),r=rows&&rows[0];
    if(!r){SF.err=true}else{
      SF.orders=(Array.isArray(r.orders)?r.orders:[]).filter(o=>o&&!o.archived&&!o.shipped).map(o=>({
        label:[o.num,o.product].filter(Boolean).join(' · ').slice(0,60),
        items:(Array.isArray(o.items)?o.items:[]).map(i=>i&&i.name).filter(Boolean).map(String)})).filter(o=>o.label);
      SF.members=(Array.isArray(r.members)?r.members:[]).map(m=>m&&m.name).filter(Boolean).map(String);
      SF.at=Date.now();SF.err=false;
    }
  }catch(e){SF.err=true}
  const a=document.activeElement;
  if(manual||!(a&&$('#rail').contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))renderRail();else railDirty=true;
}
async function boot(){
  for(const k in docs){try{const v=JSON.parse(lsGet('cp.'+k)||'null');if(isObj(v))docs[k].data=v}catch(e){}}
  normalize();mode='local';render();
  if(!WA)return;
  if(!WA.signedIn()){try{await WA.gate({lang:lang,title:t('ttl'),allowSkip:true})}catch(e){}}
  if(!WA.signedIn()){render();return}
  try{const me=await WA.me();if(me&&me.display_name)who=String(me.display_name).slice(0,40)}catch(e){}
  mode='db';render();
  const timer=setTimeout(()=>{if(!docs.layout.loaded){stale=true;renderHeader()}},10000);
  await poll();clearTimeout(timer);
  loadShopflow();
  if(timersOn)return;timersOn=true;
  setInterval(poll,6000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  setInterval(loadShopflow,300000);
}

/* ---------- helpers ---------- */
const itemName=(id,it)=>it.n||tname(TYPES[it.t]||TYPES.zone);
const peopleAt=id=>Object.entries(ST().people).filter(e=>e[1]&&e[1].at===id).sort((a,b)=>String(a[1].n).localeCompare(String(b[1].n),'lt'));
const statusOf=id=>{const s=ST().st[id];return s&&['run','idle','down'].includes(s.s)?s.s:'idle'};
function hhmm(ts){if(!ts)return'';const d=new Date(ts),n=new Date();const p=x=>String(x).padStart(2,'0');
  const tm=p(d.getHours())+':'+p(d.getMinutes());return d.toDateString()===n.toDateString()?tm:p(d.getMonth()+1)+'-'+p(d.getDate())+' '+tm}
const stockTotal=id=>{const s=ST().stock[id];return s&&Array.isArray(s.rows)?s.rows.reduce((a,r)=>a+(+r.q||0),0):0};
function hallPts(){const h=LAY().hall;if(Array.isArray(h.pts)&&h.pts.length>=3)return h.pts.map(p=>({x:+p.x||0,y:+p.y||0}));const W=+h.w||2400,H=+h.h||1350;return[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}]}
function hallBox(P){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of P){a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)}return{x0:a,y0:b,x1:c,y1:d}}
function setHall(P){
  const mx=Math.min(0,...P.map(p=>p.x)),my=Math.min(0,...P.map(p=>p.y));
  P=P.map(p=>({x:Math.round(p.x-mx),y:Math.round(p.y-my)}));const b=hallBox(P);
  commit(docs.layout,{hall:{pts:P,w:Math.max(300,b.x1),h:Math.max(300,b.y1)}});
}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
const fmtM=v=>(v/100).toLocaleString(lang,{maximumFractionDigits:2});
const today=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const instList=()=>Object.entries(ST().inst).filter(e=>e[1]&&e[1].f&&e[1].t&&e[1].t>=today()).sort((a,b)=>a[1].f<b[1].f?-1:a[1].f>b[1].f?1:0);
const instOf=pid=>{const d=today();for(const i of Object.values(ST().inst))if(i&&isObj(i.w)&&i.w[pid]&&i.f<=d&&d<=i.t)return i;return null};
const md=v=>String(v||'').slice(5);
function addProject(n){n=String(n||'').trim();if(!n||ST().projects.includes(n)||SF.orders.some(o=>o.label===n))return null;return ST().projects.concat([n]).slice(-300)}
let instForm=null;
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}

/* ---------- map ---------- */
function itemSVG(id,it){
  const T=TYPES[it.t];if(!T)return'';
  const rot=((+it.r||0)%360+360)%360, W=+it.w||T.w, H=+it.h||T.h, a=rot*Math.PI/180;
  const sw=Math.abs(W*Math.cos(a))+Math.abs(H*Math.sin(a)), sh=Math.abs(W*Math.sin(a))+Math.abs(H*Math.cos(a));
  const ppl=peopleAt(id);
  let stCls='',stTxt='';
  if(T.kind==='machine'){const s=statusOf(id);stCls=s;stTxt=t(s)}
  else if(T.kind==='desk'){stCls=ppl.length?'busy':'idle';stTxt=ppl.length?t('busy'):t('free')}
  else if(T.kind==='rack'){stTxt=stockTotal(id)+' '+t('sheets')}
  let s='<g class="it '+stCls+(selItem===id?' sel':'')+'" data-id="'+esc(id)+'" transform="translate('+(+it.x||0)+','+(+it.y||0)+')">';
  s+='<rect class="hit" x="'+(-sw/2-10)+'" y="'+(-sh/2-10)+'" width="'+(sw+20)+'" height="'+(sh+20)+'" rx="10"/>';
  s+='<g class="draw" transform="rotate('+rot+') scale('+(W/T.w)+','+(H/T.h)+')">'+T.draw()+'</g>';
  const ly=sh/2+40;
  s+='<text class="lbl" y="'+ly+'">'+esc(itemName(id,it))+'</text>';
  if(stTxt){
    const col=T.kind==='rack'?'':' s-'+stCls;
    const half=stTxt.length*7.5+(T.kind==='rack'?0:14);
    if(T.kind!=='rack')s+='<circle class="beacon s-'+stCls+'" cx="'+(-half)+'" cy="'+(ly+25)+'" r="10"/>';
    s+='<text class="stt'+col+'" '+(T.kind==='rack'?'fill="var(--muted)" ':'')+'x="'+(T.kind==='rack'?0:12)+'" y="'+(ly+34)+'">'+esc(stTxt.toUpperCase())+'</text>';
  }
  let py=-sh/2-10;
  ppl.forEach(e=>{
    const nm=String(e[1].n||'?'),pr=String(e[1].pr||'').slice(0,26),hh=pr?68:42,w=Math.max(84,nm.length*16+36,pr.length*11.5+36);py-=hh+8;
    s+='<g class="pill'+(selPerson===e[0]?' sel':'')+'" data-pid="'+esc(e[0])+'"><rect x="'+(-w/2)+'" y="'+py+'" width="'+w+'" height="'+hh+'" rx="21"/><text y="'+(py+31)+'">'+esc(nm)+'</text>'+(pr?'<text class="pp" y="'+(py+57)+'">'+esc(pr)+'</text>':'')+'</g>';
  });
  return s+'</g>';
}
function renderMap(){
  const P=(drag&&drag.P)||hallPts(),b=hallBox(P),svg=$('#map');
  const vb=(drag&&drag.vb)||[b.x0-50,b.y0-50,b.x1-b.x0+100,b.y1-b.y0+140];
  svg.setAttribute('viewBox',vb.join(' '));svg.style.aspectRatio=vb[2]+'/'+vb[3];
  svg.setAttribute('class',(editing?'editing ':'')+(selPerson?'picking':''));
  const d='M'+P.map(p=>p.x+' '+p.y).join('L')+'Z';
  let s='<defs><pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="var(--grid)" stroke-width="2"/></pattern></defs>';
  s+='<path d="'+d+'" fill="var(--floor)"/><path d="'+d+'" fill="url(#g)"/><path d="'+d+'" fill="none" stroke="var(--wall)" stroke-width="12" stroke-linejoin="miter"/>';
  s+='<g><line x1="'+b.x0+'" y1="'+(b.y1+50)+'" x2="'+(b.x0+100)+'" y2="'+(b.y1+50)+'" stroke="var(--muted)" stroke-width="5"/><text class="dim" x="'+(b.x0+112)+'" y="'+(b.y1+58)+'">1 m · '+fmtM(b.x1-b.x0)+' × '+fmtM(b.y1-b.y0)+' m</text></g>';
  const items=Object.entries(LAY().items).filter(e=>e[1]&&TYPES[e[1].t]);
  const order={zone:0,gate:1,rack:2,desk:3,machine:4};
  items.sort((a,b)=>order[TYPES[a[1].t].kind]-order[TYPES[b[1].t].kind]);
  for(const [id,it] of items)s+=itemSVG(id,it);
  if(editing){
    P.forEach((p,i)=>{const q=P[(i+1)%P.length],len=Math.hypot(q.x-p.x,q.y-p.y)||1,mx=(p.x+q.x)/2,my=(p.y+q.y)/2,nx=-(q.y-p.y)/len,ny=(q.x-p.x)/len;
      s+='<text class="elbl" x="'+(mx+nx*72)+'" y="'+(my+ny*56+10)+'">'+fmtM(len)+' m</text>';
      s+='<g class="vadd" data-e="'+i+'" transform="translate('+mx+','+my+')"><circle r="15"/><text y="9">+</text></g>'});
    P.forEach((p,i)=>{s+='<circle class="vh" data-v="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="19"/>'});
  }
  svg.innerHTML=s;
}

function init3D(){

    renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));el.appendChild(renderer.domElement);
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,10,60000),root=new THREE.Group();
    scene.add(new THREE.AmbientLight(0xffffff,.72));
    const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-600,1500,900);scene.add(sun);scene.add(root);
    T3={el,renderer,scene,camera,root,movers:[],pulsers:[],cam:{th:0,ph:.86,d:3000,tx:1200,tz:700,key:''},ray:new THREE.Raycaster()};
    const fit=()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
    T3.fit=fit;if(window.ResizeObserver)new ResizeObserver(fit).observe(el);else window.addEventListener('resize',fit);
    events3D(renderer.domElement);

    (function loop(){

      if(view!=='3d'||document.hidden)return;
      const tt=(performance.now()-t0)/1000,still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!still){
        for(const m of T3.movers){const o=m.kind==='slide'?45*Math.sin(tt*1.4):m.kind==='gantry'?-15+120*Math.sin(tt*.9):((tt*55)%330)-170;m.mesh.position.x=m.bx+o}
        for(const p of T3.pulsers){const k=1+.25*Math.sin(tt*4.5);p.scale.set(k,k,k)}
        if(document.body.classList.contains('tv')&&!T3.ptrs.size)T3.cam.th+=.0007;

  }catch(e){T3=null;return false}
}

  return null;
}
function floorPt(e){

function events3D(cv3){
  T3.ptrs=new Map();let st=null,pinch=0;
  cv3.addEventListener('pointerdown',e=>{
    T3.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv3.setPointerCapture(e.pointerId)}catch(_){}
    if(T3.ptrs.size===2){const a=[...T3.ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);st=null;return}
    st={x:e.clientX,y:e.clientY,moved:false,item:null};
    if(editing){const h=pick3(e);if(h){const it=LAY().items[h.id],p=floorPt(e);if(it&&p){st.item={id:h.id,g:h.group,dx:p.x-it.x,dz:p.z-it.y,x:it.x,y:it.y};busy3=true}}}
  });
  cv3.addEventListener('pointermove',e=>{
    const pp=T3.ptrs.get(e.pointerId);if(!pp)return;
    const dx=e.clientX-pp.x,dy=e.clientY-pp.y;pp.x=e.clientX;pp.y=e.clientY;
    if(T3.ptrs.size===2){const a=[...T3.ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch&&d){T3.cam.d=Math.max(300,Math.min(12000,T3.cam.d*pinch/d))}pinch=d;return}
    if(!st)return;
    if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>5)st.moved=true;
    if(!st.moved)return;
    if(st.item){const p=floorPt(e);if(!p)return;const h=LAY().hall;
      st.item.x=Math.max(0,Math.min(h.w,Math.round((p.x-st.item.dx)/10)*10));st.item.y=Math.max(0,Math.min(h.h,Math.round((p.z-st.item.dz)/10)*10));
      st.item.g.position.set(st.item.x,0,st.item.y);return}
    const c=T3.cam;
    if(e.shiftKey){const k=c.d/900;c.tx-=(dx*Math.cos(c.th)+dy*Math.sin(c.th))*k;c.tz-=(-dx*Math.sin(c.th)+dy*Math.cos(c.th))*k}
    else{c.th-=dx*.006;c.ph=Math.max(.08,Math.min(1.45,c.ph-dy*.005))}
  });

    if(!T3.ptrs.has(e.pointerId))return;T3.ptrs.delete(e.pointerId);pinch=0;
    const s=st;st=null;busy3=false;if(!s||e.type==='pointercancel'){if(s&&s.item)render();return}
    if(s.item&&s.moved){if(!canWrite()){render();return}const p={items:{}};p.items[s.item.id]={x:s.item.x,y:s.item.y};selItem=s.item.id;commit(docs.layout,p);return}
    if(s.moved)return;
    pendDel=null;const h=pick3(e);
    if(h&&h.pid&&!editing){selPerson=selPerson===h.pid?null:h.pid;render();return}
    if(h){if(selPerson&&!editing){movePerson(selPerson,h.id);return}selItem=h.id}else selItem=null;
    render();
  };
  cv3.addEventListener('pointerup',up);cv3.addEventListener('pointercancel',up);
  cv3.addEventListener('wheel',e=>{e.preventDefault();T3.cam.d=Math.max(300,Math.min(12000,T3.cam.d*Math.exp(e.deltaY*.0012)))},{passive:false});
}

$('#btnAuth').addEventListener('click',()=>{boot()});
$('#btnLang').addEventListener('click',()=>{lang=lang==='lt'?'en':'lt';lsSet('cp.lang',lang);railDirty=false;render();renderRail();tick()});
$('#btnEdit').addEventListener('click',()=>{editing=!editing;selPerson=null;pendDel=null;railDirty=false;render();renderRail()});
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function setTv(on,gesture){
  document.body.classList.toggle('tv',on);
  if(on){editing=false;selItem=null;wake();
    if(gesture){try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
    if(location.hash!=='#tv'){try{location.hash='tv'}catch(e){}}
  }else{
    try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
    if(location.hash==='#tv'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(_){}}}
  }
  railDirty=false;render();renderRail();
}
$('#btnTv').addEventListener('click',()=>setTv(!document.body.classList.contains('tv'),true));
window.addEventListener('hashchange',()=>{const want=location.hash==='#tv';if(want!==document.body.classList.contains('tv'))setTv(want,false)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.body.classList.contains('tv'))wake()});

function tick(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
setInterval(tick,10000);tick();
if(location.hash==='#tv')document.body.classList.add('tv');
normalize();applyView();render();boot();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view==='3d')build3D()});
})();
</script>
</body>
</html>
