<title>Dėdės Baldai Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style id="hub-css">
/* Layout: three switchable directions over one data set.
   Lapas = apps nested as parts on a 2800×2070 sheet (asymmetric 12-col spans).
   Stotis = 5fr sticky clock column / 8fr full-width station rows.
   Žurnalas = 5fr editorial lead + cover / 7fr dropped contents index. */
/* generated from tokens.py: light first, every direction restates every token */
:root{--bg:#e6e8e3;--surface:#f8f9f6;--surface-2:#eef0ec;--ink:#131715;--muted:#59615b;--line:#d2d7cf;--line-2:#b4bbb1;--accent:#ff4a1c;--on-accent:#160700;--s-design:#2f55c8;--s-cnc:#c27c00;--s-prod:#127c52;--s-staff:#7a4ab8;--focus:#ff4a1c;--shadow:0 1px 0 rgba(19,23,21,.05),0 12px 26px -18px rgba(19,23,21,.42);--f-display:'Schibsted Grotesk','Helvetica Neue',sans-serif;--f-body:'Schibsted Grotesk','Helvetica Neue',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:3px;--r-dock:4px;--ease:cubic-bezier(.2,.8,.2,1);--ease-snap:cubic-bezier(.3,.7,.1,1);}
:root[data-dir="stotis"]{--bg:#f2f1ec;--surface:#ffffff;--surface-2:#e8e7e1;--ink:#0b1015;--muted:#535b63;--line:#d4d3cb;--line-2:#0b1015;--accent:#ffc400;--on-accent:#0b1015;--s-design:#1f5fe0;--s-cnc:#b88400;--s-prod:#0e8050;--s-staff:#7a3fd0;--focus:#0b1015;--shadow:none;--f-display:'Big Shoulders Display','Arial Narrow',sans-serif;--f-body:'Archivo','Helvetica Neue',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:0px;--r-dock:0px;}
:root[data-dir="zurnalas"]{--bg:#edefe7;--surface:#f8f9f3;--surface-2:#e3e6db;--ink:#0f231c;--muted:#56645d;--line:#cdd2c4;--line-2:#0f231c;--accent:#86590a;--on-accent:#fbf8ef;--s-design:#2d50b8;--s-cnc:#b5470f;--s-prod:#1d7a46;--s-staff:#6b4a9e;--focus:#86590a;--shadow:none;--f-display:'Newsreader','Iowan Old Style',Georgia,serif;--f-body:'Hanken Grotesk','Helvetica Neue',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:999px;--r-dock:999px;}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--bg:#0f1211;--surface:#191d1b;--surface-2:#141816;--ink:#e9ede8;--muted:#8e9890;--line:#2a302c;--line-2:#3d4540;--accent:#ff6b3d;--on-accent:#160700;--s-design:#86a5ff;--s-cnc:#f0b23a;--s-prod:#4cc993;--s-staff:#c3a1ff;--focus:#ff6b3d;--shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.85);color-scheme:dark;}
:root[data-dir="stotis"]:not([data-theme="light"]){--bg:#121c25;--surface:#18242f;--surface-2:#1d2b38;--ink:#f1f4f6;--muted:#8fa0ae;--line:#263646;--line-2:#f1f4f6;--accent:#ffc93c;--on-accent:#0b1015;--s-design:#7fb0ff;--s-cnc:#ffc93c;--s-prod:#5fd39b;--s-staff:#c9a7ff;--focus:#ffc93c;--shadow:none;color-scheme:dark;}
:root[data-dir="zurnalas"]:not([data-theme="light"]){--bg:#0d1f19;--surface:#122a22;--surface-2:#0a1814;--ink:#ece9dd;--muted:#93a89d;--line:#1f3a30;--line-2:#ece9dd;--accent:#e2b766;--on-accent:#0d1f19;--s-design:#93abff;--s-cnc:#ff9466;--s-prod:#6fd29a;--s-staff:#c2a8f0;--focus:#e2b766;--shadow:none;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0f1211;--surface:#191d1b;--surface-2:#141816;--ink:#e9ede8;--muted:#8e9890;--line:#2a302c;--line-2:#3d4540;--accent:#ff6b3d;--on-accent:#160700;--s-design:#86a5ff;--s-cnc:#f0b23a;--s-prod:#4cc993;--s-staff:#c3a1ff;--focus:#ff6b3d;--shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.85);color-scheme:dark;}
:root[data-theme="dark"][data-dir="stotis"]{--bg:#121c25;--surface:#18242f;--surface-2:#1d2b38;--ink:#f1f4f6;--muted:#8fa0ae;--line:#263646;--line-2:#f1f4f6;--accent:#ffc93c;--on-accent:#0b1015;--s-design:#7fb0ff;--s-cnc:#ffc93c;--s-prod:#5fd39b;--s-staff:#c9a7ff;--focus:#ffc93c;--shadow:none;color-scheme:dark;}
:root[data-theme="dark"][data-dir="zurnalas"]{--bg:#0d1f19;--surface:#122a22;--surface-2:#0a1814;--ink:#ece9dd;--muted:#93a89d;--line:#1f3a30;--line-2:#ece9dd;--accent:#e2b766;--on-accent:#0d1f19;--s-design:#93abff;--s-cnc:#ff9466;--s-prod:#6fd29a;--s-staff:#c2a8f0;--focus:#e2b766;--shadow:none;color-scheme:dark;}

@property --sweep{syntax:'<percentage>';inherits:false;initial-value:0%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease),color .3s var(--ease)}
[data-g="design"]{--stage:var(--s-design)}
[data-g="cnc"]{--stage:var(--s-cnc)}
[data-g="production"]{--stage:var(--s-prod)}
[data-g="staff"]{--stage:var(--s-staff)}
.page{max-width:1320px;margin:0 auto;padding-block:28px 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
a{color:inherit}
button{font:inherit;color:inherit}
.kbd{font-family:var(--f-mono);font-size:12px;font-weight:500;min-width:26px;height:26px;padding:0 7px;display:inline-grid;place-items:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:min(var(--r),7px);color:var(--muted);background:var(--surface);transition:transform .09s linear,border-width .09s linear;flex:none}
a:active .kbd,.hit .kbd{transform:translateY(1px);border-bottom-width:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* reveal: starts visible (.35), releases after so hover transforms still apply */
@keyframes rv{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim .rv{animation:rv .52s var(--ease) backwards;animation-delay:calc(min(var(--i,0),9) * 45ms)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}

/* shared controls */
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.seg button{font-size:12.5px;font-weight:600;padding:6px 10px;border:0;border-radius:calc(var(--r) - 2px);background:transparent;color:var(--muted);cursor:pointer;min-height:32px;letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ib{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-height:40px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.ib:hover{border-color:var(--ink)}
.ib svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-height:42px;padding:0 18px;border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}

/* ============ LAPAS ============ */
.L-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:20px 36px;padding-bottom:22px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.L .mark{width:52px;height:52px;flex:none;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.L .mark svg{width:30px;height:30px}
.L h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3.4vw,46px);letter-spacing:-.035em;line-height:.92}
.L .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.L-meta{display:flex;gap:28px;margin:0;flex-wrap:wrap}
.L-meta dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.L-meta dd{margin:3px 0 0;font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.L-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.L-filters{display:flex;flex-wrap:wrap;gap:6px}
.L-filters button{display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.L-filters button i{width:10px;height:10px;background:var(--stage,var(--ink));flex:none}
.L-filters button b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.L-filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.L-search{position:relative;flex:0 1 300px;min-width:0}
.L-search input{width:100%;min-height:40px;font-family:var(--f-mono);font-size:13.5px;padding:0 40px 0 36px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.L-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.L-search .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:22px;min-width:22px;font-size:11px}
.L-ruler{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding:0 1px 9px;background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 2.5%) bottom/100% 5px no-repeat}
.L-sheet{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(158px,auto);grid-auto-flow:dense;gap:8px;padding:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.L-part{grid-column:span var(--c);grid-row:span var(--r);position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 18px 14px 26px;background:var(--surface);color:inherit;text-decoration:none;box-shadow:var(--shadow);min-width:0;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.L-part::before{content:"";position:absolute;inset:-2px;padding:2px;background:conic-gradient(from 0deg,var(--accent) var(--sweep),transparent 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:--sweep .55s var(--ease)}
a.L-part:hover,a.L-part.hit{transform:translateY(-2px)}
a.L-part:hover::before,a.L-part:focus-visible::before,a.L-part.hit::before{--sweep:100%}
a.L-part:active{transform:scale(.99)}
a.L-part:focus-visible{outline:none}
.L-edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--stage)}
.L-top{display:flex;align-items:center;gap:8px}
.L-code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-right:auto}
.L-tag{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border:1px solid var(--stage);color:var(--stage)}
.L-ico{width:42px;height:42px;color:var(--stage)}
.L-ico svg{width:100%;height:100%}
.L-part h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,1.75vw,25px);letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.L-part p{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:42ch}
.L-part.big{padding:22px 26px 18px 34px}
.L-part.big .L-ico{width:96px;height:96px;margin-block:6px auto}
.L-part.big h3{font-weight:800;font-size:clamp(36px,4.2vw,62px);letter-spacing:-.045em;line-height:.92}
.L-part.big p{font-size:16px;margin-top:10px}
.L-dim{margin-top:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.L-dim i{flex:1;height:1px;background:currentColor;opacity:.55;position:relative;min-width:12px}
.L-dim i::before{content:"";position:absolute;top:-4px;height:9px;width:1px;background:currentColor}
.L-dim i:first-child::before{left:0}
.L-dim i:last-child::before{right:0}
.L-part.off{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--line) 7px 8px),var(--surface-2);box-shadow:none;color:var(--muted)}
.L-part.off .L-ico{opacity:.5}
.L-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.L-legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.L-legend span{display:inline-flex;align-items:center;gap:6px}
.L-legend i{width:12px;height:4px;background:var(--stage)}
@media (max-width:960px){.L-head{grid-template-columns:1fr auto}.L-meta{grid-column:1/-1;order:3}}
@media (max-width:900px){.L-sheet{grid-template-columns:repeat(6,minmax(0,1fr))}.L-part{grid-column:span 3;grid-row:span 1}.L-part.big{grid-column:span 6}.L-part.big .L-ico{width:64px;height:64px}}
@media (max-width:560px){.L-head{grid-template-columns:1fr}.L-meta{gap:18px}.L-meta div:nth-child(1){display:none}.L-sheet{grid-template-columns:1fr}.L-part,.L-part.big{grid-column:1/-1}.L-search{flex:1 1 100%}.L-ruler span:nth-child(2),.L-ruler span:nth-child(4){display:none}}

/* ============ STOTIS ============ */
.S{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:0 56px;align-items:start}
.S-side{position:sticky;top:calc(28px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:22px;min-width:0}
.S-brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.S-mark{width:44px;height:44px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.S-mark svg{width:26px;height:26px}
.S-clock{font-family:var(--f-display);font-weight:800;font-size:clamp(96px,11.5vw,176px);line-height:.8;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:8px}
.S-when{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:18px;font-weight:500}
.S-week{background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px}
.S-greet{margin:0;color:var(--muted);font-size:16px}
.S-filters{display:flex;flex-direction:column;border-top:3px solid var(--line-2)}
.S-filters button{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left}
.S-filters button i{width:14px;height:14px;border:2px solid var(--stage,var(--ink));flex:none}
.S-filters button b{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:14px}
.S-filters button[aria-pressed="true"]{color:var(--ink)}
.S-filters button[aria-pressed="true"] i{background:var(--stage,var(--ink))}
.S-search{position:relative}
.S-search input{width:100%;min-height:52px;font-size:18px;padding:0 44px 0 34px;border:0;border-bottom:2px solid var(--line-2);background:transparent;color:var(--ink);border-radius:0}
.S-search svg{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.S-search .kbd{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.S-board{display:flex;flex-direction:column;gap:40px;min-width:0}
.S-group h2{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.S-group h2 i{width:12px;height:12px;background:var(--stage)}
.S-group h2 span{font-family:var(--f-mono);font-weight:500;letter-spacing:0;font-size:13px}
.S-list{border-top:3px solid var(--line-2)}
.S-row{position:relative;isolation:isolate;display:grid;grid-template-columns:72px minmax(0,1fr) auto 40px;align-items:center;gap:22px;min-height:112px;padding:16px 14px 16px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:color .2s var(--ease-snap),padding .24s var(--ease-snap)}
.S-row::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .24s var(--ease-snap);z-index:-1}
a.S-row:hover,a.S-row:focus-visible,a.S-row.hit{color:var(--on-accent);padding-left:12px}
a.S-row:hover::before,a.S-row:focus-visible::before,a.S-row.hit::before{transform:scaleX(1)}
a.S-row:focus-visible{outline-offset:-3px}
a.S-row:active{transform:scale(.995)}
.S-key{width:68px;height:68px;display:grid;place-items:center;border:2px solid currentColor;font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.S-name{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4.3vw,62px);line-height:.88;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere}
.S-desc{display:block;margin-top:8px;font-size:16px;color:var(--muted);transition:color .2s}
a.S-row:hover .S-desc,a.S-row:focus-visible .S-desc,a.S-row.hit .S-desc{color:inherit}
.S-tag{font-family:var(--f-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid currentColor;padding:4px 9px;white-space:nowrap}
.S-tag.none{border:0;padding:0}
.S-go svg{width:34px;height:34px;transition:transform .24s var(--ease-snap)}
a.S-row:hover .S-go svg{transform:translateX(4px)}
.S-row.off{color:var(--muted)}
.S-row.off .S-key{border-style:dashed}
@media (max-width:900px){.S{grid-template-columns:1fr;gap:28px}.S-side{position:static}.S-clock{font-size:96px}.S-filters{flex-direction:row;flex-wrap:wrap;border-top:0;gap:6px}.S-filters button{border:2px solid var(--line);min-height:48px;padding:0 12px;font-size:18px}.S-filters button[aria-pressed="true"]{border-color:var(--ink)}.S-filters button b{margin-left:4px}}
@media (max-width:560px){.S-row{grid-template-columns:52px minmax(0,1fr) 28px;gap:14px;min-height:96px}.S-key{width:50px;height:50px;font-size:28px}.S-tag{display:none}.S-go svg{width:26px;height:26px}.S-name{font-size:36px}}

/* ============ ŽURNALAS ============ */
.Z-mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:4px double var(--line-2)}
.Z-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.Z-title b{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.01em}
.Z-title span,.Z-issue{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.Z-issue{font-family:var(--f-mono);letter-spacing:.08em}

.dock{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:3px;padding:5px;background:var(--ink);color:var(--bg);border-radius:var(--r-dock);box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}

  h+=sec(5,'Layout',
    '<p>Spacing scale: <span class="mono">4 · 8 · 12 · 16 · 22 · 28 · 40 · 56 · 80</span>. Page max-width is 1320 px, with a gutter of max(20px, safe-area) on each side. None of the directions uses a uniform card grid. Visual weight follows what the shopfloor opens most.</p>'+
    '<ul class="sp-rules">'+
    '<li><b>Lapas</b><span>A 12-column sheet with an 8 px kerf gap and rows at least 158 px tall. Spans for six parts are 7×2, 5, 5, 5, 4 and 3, so no two rows split the same way. Below 900 px it becomes 6 columns, with the feature part at 6 and the rest at 3. Below 560 px it is one column. A ruler sits above the sheet and the header carries real sheet data (size, part count, week, time).</span></li>'+
    '<li><b>Stotis</b><span>A 5fr / 8fr split with a 56 px gutter. The clock column is sticky. Rows are at least 112 px with 68 px key caps, and each stage opens with a 3 px ink rule. Below 900 px it stacks and the stage filters turn into a horizontal row of large buttons.</span></li>'+
    '<li><b>Žurnalas</b><span>A 5fr / 7fr spread with an 80 px gutter. The contents column starts 132 px lower so the greeting leads. Each entry is a 4-track grid: number 44 px / title / dotted leader 1fr / key. Below 960 px it is one column, with the cover following the greeting.</span></li></ul>');

  h+=sec(6,'Motion',
    '<p>Everything is a transform, opacity or custom-property transition, so it stays on the compositor. Nothing waits on scroll. The page is complete at rest, and reveals start from 35% opacity, not zero.</p>'+
    '<div class="tbl"><table><thead><tr><th>Moment</th><th>Trigger</th><th>Change</th><th>Time</th><th>Easing</th></tr></thead><tbody>'+
    [['Reveal','Load, direction switch','translateY 10→0, opacity .35→1, stagger 45 ms (cap 9)','520 ms','cubic-bezier(.2,.8,.2,1)'],
     ['Direction switch','Dock, #hash','View Transitions cross-fade of the root; instant fallback','280 ms','same'],
     ['Toolpath trace','Lapas: hover, focus, key','@property --sweep 0→100% on a conic border mask','550 ms','same'],
     ['Signal fill','Stotis: hover, focus, key','::before scaleX 0→1 from left, text flips to on-accent, row nudges 12 px','240 ms','cubic-bezier(.3,.7,.1,1)'],

     ['Key press','1–9, pointer down','key cap drops 1 px, border 2→1; target shows its hover state 160 ms, then opens','90 + 160 ms','linear'],

     .map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i>=3?' class="mono"':'')+'>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>'+

    '<li><b>Colour</b><span>Stage is never shown by colour alone: it is always named in a label, heading or legend.</span></li></ul>');

  h+=sec(8,'Build and ship',

/* ---------- dock, editor ---------- */

  if(LOCK) return '';
  return '<nav class="dock" aria-label="'+t('direction')+'"><span class="lbl">'+t('direction')+'</span>'+
    DIRS.map(function(d){return '<a href="#'+d.id+'" aria-current="'+(view==='hub'&&dir===d.id)+'">'+d.name+'</a>';}).join('')+
    '<span class="sep"></span><a href="#spec" data-view="spec" aria-current="'+(view==='spec')+'">'+t('spec')+'</a></nav>';
}
function editHTML(){
  var opts=function(sel){return GROUPS.map(function(g){return '<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+esc(g[lang])+'</option>';}).join('');};
  return '<div class="ed-wrap" id="ed-wrap"><div class="ed" role="dialog" aria-modal="true" aria-labelledby="ed-title"><h2 id="ed-title">'+t('editTitle')+'</h2><p class="note">'+t('editNote')+'</p>'+
    draft.map(function(a,i){return '<div class="ed-row" data-i="'+i+'">'+
      '<label>'+t('name')+'<input id="n-'+esc(a.id)+'" data-f="name" value="'+esc(txt(a.name))+'"></label>'+

      '<label class="w">'+t('desc')+'<input id="d-'+esc(a.id)+'" data-f="desc" value="'+esc(txt(a.desc))+'"></label>'+
      '<label class="w">'+t('url')+'<input class="url" id="u-'+esc(a.id)+'" data-f="url" type="url" placeholder="https://…" value="'+esc(a.url)+'"></label>'+
      '<button type="button" class="del" data-del="'+i+'">'+t('del')+'</button></div>';}).join('')+
    '<button type="button" class="btn ghost" data-add="1">'+t('add')+'</button>'+
    '<div class="ed-foot"><button type="button" class="btn ghost" id="btn-cancel">'+t('cancel')+'</button><button type="button" class="btn" id="btn-save">'+t('save')+'</button></div></div></div>';
}

/* ---------- render ---------- */
function render(anim){
  ROOT.setAttribute('data-dir',dir); ROOT.lang=lang;
  var body=view==='spec'?renderSpec():(dir==='stotis'?renderS():dir==='zurnalas'?renderZ():renderL());
  app.innerHTML='<div class="page'+(anim&&!reduced?' anim':'')+'">'+body+'</div>'+dockHTML()+(editing?editHTML():'');
  lastGreet=now().greet;
}
function go(fn){ if(document.startViewTransition&&!reduced){document.startViewTransition(fn);} else fn(); }
function applyHash(anim){
  if(LOCK){view='hub';render(anim);return;}
  var h=location.hash.slice(1);
  if(h==='spec'){view='spec';}
  else if(DIRS.some(function(d){return d.id===h;})){view='hub';dir=h;specDir=null;try{localStorage.setItem('hub-dir',dir);}catch(e){}}
  else view='hub';
  render(anim);
  if(anim!==false) window.scrollTo(0,0);
}
function toast(msg,ms){var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove();},ms||2600);}
function readDraft(){
  app.querySelectorAll('.ed-row').forEach(function(row){
    var a=draft[+row.getAttribute('data-i')]; if(!a) return;
    row.querySelectorAll('[data-f]').forEach(function(inp){
      var f=inp.getAttribute('data-f'), v=inp.value.trim();
      if(f==='name'||f==='desc'){a[f]=a[f]||{};a[f][lang]=v;if(!a[f].lt)a[f].lt=v;if(!a[f].en)a[f].en=v;}
      else if(f==='url'){a.url=v&&!/^https?:\/\//i.test(v)?'https://'+v:v;}
      else a[f]=v;
    });
  });
}
function buildDocument(state){
  var reset=(document.head.querySelector('style')||{}).textContent||'';
  var S='script', json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Dėdės Baldai Hub</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONT_URL+'">\n'+
    document.getElementById('hub-css').outerHTML+'\n'+document.getElementById('hub-boot').outerHTML+'\n<div id="app"></div>\n'+
    '<'+S+' type="application/json" id="hub-data">'+json+'</'+S+'>\n'+
    document.getElementById('hub-tokens').outerHTML+'\n'+document.getElementById('hub-main').outerHTML+'\n</body></html>';
}
async function save(){
  readDraft();
  var btn=document.getElementById('btn-save'); if(btn){btn.disabled=true;btn.textContent=t('saving');}
  var next={base:DATA.base,apps:draft.filter(function(a){return txt(a.name);})};
  try{
    if(!artifactNs) throw {code:'not_granted'};
    await artifactNs.publish(buildDocument(next));
    DATA=next;editing=false;draft=null;render();toast(t('saved'));
  }catch(e){
    var code=e&&e.code;
    if(code==='conflict'){toast(t('conflict'),4000);return;}
    toast(code==='not_granted'||code==='not_writer'?t('ro'):t('fail'),4000);
    if(btn){btn.disabled=false;btn.textContent=t('save');}
  }
}
function openKey(k){
  var a=app.querySelector('a[data-key="'+k+'"]'); if(!a) return;
  a.classList.add('hit');
  setTimeout(function(){a.click();a.classList.remove('hit');},reduced?0:160);
}

app.addEventListener('click',function(e){
  var d=e.target.closest('a[href^="#"]');
  if(d){e.preventDefault();var target=d.getAttribute('href');if(location.hash===target){applyHash(true);return;}go(function(){location.hash=target;});return;}
  var cp=e.target.closest('[data-copy]');
  if(cp){var pre=cp.parentNode.querySelector('pre');var done=function(){cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy';},1400);};
    try{navigator.clipboard.writeText(pre.textContent).then(done,function(){selectText(pre);});}catch(_){selectText(pre);}return;}
  var el=e.target.closest('button');
  if(!el){ if(e.target.id==='ed-wrap'){editing=false;draft=null;render();} return; }
  if(el.dataset.lang){if(editing)readDraft();lang=el.dataset.lang;try{localStorage.setItem('hub-lang',lang);}catch(_){}render();return;}
  if(el.dataset.filter){filter=el.dataset.filter;try{localStorage.setItem('hub-filter',filter);}catch(_){}render();return;}
  if(el.dataset.specdir){specDir=el.dataset.specdir;var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(el.id==='btn-theme'){themePref=themePref==='auto'?'light':themePref==='light'?'dark':'auto';
    if(themePref==='auto')ROOT.removeAttribute('data-theme');else ROOT.setAttribute('data-theme',themePref);
    try{localStorage.setItem('hub-theme',themePref);}catch(_){} render(); var b=document.getElementById('btn-theme'); if(b) b.focus(); return;}
  if(el.id==='btn-edit'){editing=true;draft=JSON.parse(JSON.stringify(DATA.apps));render();return;}
  if(el.id==='btn-cancel'){editing=false;draft=null;render();return;}
  if(el.id==='btn-save'){save();return;}
  if(el.dataset.del!=null){readDraft();draft.splice(+el.dataset.del,1);render();return;}
  if(el.dataset.add){readDraft();var n=1;draft.forEach(function(a){var m=/DB-(\d+)/.exec(a.code||'');if(m)n=Math.max(n,+m[1]+1);});
    var id='app'+Date.now().toString(36);
    draft.push({id:id,code:'DB-'+pad(n),group:filter!=='all'?filter:'production',icon:'generic',url:'',name:{lt:T.lt.newapp,en:T.en.newapp},desc:{lt:'',en:''}});
    render();var inp=document.getElementById('n-'+id);if(inp){inp.focus();inp.select();}}
});
function selectText(el){try{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);}catch(_){}}
app.addEventListener('input',function(e){
  if(e.target.id==='hub-search'){q=e.target.value;var pos=e.target.selectionStart;render();var s=document.getElementById('hub-search');s.focus();try{s.setSelectionRange(pos,pos);}catch(_){}}
});
app.addEventListener('keydown',function(e){
  if(e.target.id==='hub-search'&&e.key==='Enter'){var first=app.querySelector('a[data-key="1"]');if(first)first.click();}
  if(e.target.id==='hub-search'&&e.key==='Escape'){q='';render();document.getElementById('hub-search').focus();}
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(editing){if(e.key==='Escape'){editing=false;draft=null;render();}return;}
  var tag=document.activeElement&&document.activeElement.tagName;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if(view!=='hub') return;
  if(e.key==='/'){e.preventDefault();var s=document.getElementById('hub-search');if(s)s.focus();return;}
  if(/^[1-9]$/.test(e.key)){e.preventDefault();openKey(e.key);}
});
window.addEventListener('hashchange',function(){applyHash(true);});
setInterval(function(){
  var N=now();
  if(N.greet!==lastGreet&&!editing&&!(document.activeElement&&/^(INPUT|SELECT)$/.test(document.activeElement.tagName))){render();return;}
  app.querySelectorAll('[data-clock]').forEach(function(el){el.textContent=N.time;});
  app.querySelectorAll('[data-date]').forEach(function(el){el.textContent=N.date;});
},15000);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(view==='spec')render();});}catch(_){}
try{new MutationObserver(function(){if(view==='spec')render();}).observe(ROOT,{attributes:true,attributeFilter:['data-theme']});}catch(_){}

applyHash(true);

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var user=r[0]; artifactNs=r[1];
    if(!user||!artifactNs) return;
    return Promise.resolve(user.canEdit()).then(function(ok){canEdit=!!ok;if(canEdit&&!editing)render();});
  }).catch(function(){});
}
})();
</script>
<!-- Office tiles: locked until the office sign-in is open on this computer (workshop-auth.js, slot "office").
     Read-only here: the hub never signs anyone in and never keeps the office sign-in alive. -->
<style>
[data-g="office"]{--stage:#4d5b6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-g="office"]{--stage:#9aa8b6}}
:root[data-theme="dark"] [data-g="office"]{--stage:#9aa8b6}

/* lock badge — same box, type and line weight as the number badge (.kbd) */
.lk{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 7px;margin-left:auto;
  font:500 10.5px/1 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);
  transition:color .15s,box-shadow .15s,background .15s}
.lk svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
.lk + .kbd{margin-left:6px !important}
.lk .lk-hover{display:none}
.lk.float{position:absolute;top:12px;right:12px;z-index:2}
a[data-locked]{position:relative}
a[data-locked] .L-ico,a[data-locked] [class*="-ico"]{opacity:.45;transition:opacity .15s}
a[data-locked]:hover .lk,a[data-locked]:focus-visible .lk{color:var(--surface);background:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
a[data-locked]:hover .lk .lk-rest,a[data-locked]:focus-visible .lk .lk-rest{display:none}
a[data-locked]:hover .lk .lk-hover,a[data-locked]:focus-visible .lk .lk-hover{display:inline}
a[data-locked]:hover [class*="-ico"],a[data-locked]:focus-visible [class*="-ico"]{opacity:.8}
/* open: quiet, with the time left before it locks again */
.lk.open{color:var(--stage);box-shadow:inset 0 0 0 1px currentColor}
.lk.open.soon{color:#b4541e}
@media (prefers-reduced-motion:reduce){.lk,a[data-locked] [class*="-ico"]{transition:none}}

#office-pc{position:fixed;left:12px;bottom:12px;z-index:50;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;
  font:500 10.5px/1.2 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);cursor:pointer}
#office-pc input{margin:0;accent-color:var(--ink)}
#office-pc:hover{color:var(--ink)}
@media print{#office-pc,.lk{display:none}}
</style>
<script>
(function(){
  var KEY='sb-niveinyzkkwtreeeaziv-auth-token-office', IDLE='workshop.office.lastActive', PC='workshop.officeComputer', MIN=10;
  var OFFICE=['https://gervdalius-droid.github.io/offer/'];   // Prašymai is open to everyone: workers fill in, office keeps the registry
  var SHUT='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 5.5h7v5h-7zM4 5.5V3.8a2 2 0 0 1 4 0v1.7"/></svg>';
  var OPEN='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 5.5h7v5h-7zM4 5.5V3.8a2 2 0 0 1 3.9-.6"/></svg>';
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function state(){
    var s=null;try{s=JSON.parse(ls(KEY)||'null');}catch(e){}
    if(ls(PC)==='1')return {pc:true};
    if(!s||!s.access_token)return {locked:true};
    var left=MIN-(Date.now()-(+ls(IDLE)||0))/60000;
    return left>0?{left:Math.max(1,Math.ceil(left))}:{locked:true};
  }
  function badge(a,html,cls,label){
    var b=a.querySelector('.lk');
    if(!b){b=document.createElement('span');var k=a.querySelector('.kbd');
      if(k&&k.parentNode){k.parentNode.insertBefore(b,k);}else{b.classList.add('float');a.appendChild(b);}}
    b.className='lk'+(b.classList.contains('float')?' float':'')+(cls?' '+cls:'');
    if(b.innerHTML!==html)b.innerHTML=html;
    a.setAttribute('aria-label',(a.querySelector('h3,h2')||a).textContent.trim()+' — '+label);
  }
  function decorate(){
    var st=state();
    document.querySelectorAll('a[href]').forEach(function(a){
      if(OFFICE.indexOf(a.href.split('?')[0])<0)return;
      var b=a.querySelector('.lk');
      if(st.pc){if(b)b.remove();a.removeAttribute('data-locked');a.removeAttribute('aria-label');a.removeAttribute('title');return;}
      if(st.locked){
        a.setAttribute('data-locked','');a.title='Atsidarys įvedus biuro PIN';
        badge(a,SHUT+'<span class="lk-rest">Biuro PIN</span><span class="lk-hover">Atrakinti</span>','', 'užrakinta, reikia biuro PIN');
      }else{
        a.removeAttribute('data-locked');a.title='Užsirakins po '+st.left+' min. be veiklos';
        badge(a,OPEN+'<span>Atrakinta · '+st.left+' min</span>',st.left<=2?'open soon':'open','atrakinta, užsirakins po '+st.left+' min.');
      }
    });
    var cb=document.querySelector('#office-pc input');if(cb)cb.checked=!!st.pc;
  }
  var t=null;new MutationObserver(function(m){
    if(m.every(function(x){return x.target.closest&&x.target.closest('.lk');}))return;   // ignore our own badge updates
    clearTimeout(t);t=setTimeout(decorate,30);
  }).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('storage',decorate);window.addEventListener('focus',decorate);setInterval(decorate,15000);
  var lbl=document.createElement('label');lbl.id='office-pc';
  lbl.innerHTML='<input type="checkbox"> Biuro kompiuteris';
  lbl.title='Pažymėkite tik biuro kompiuteryje: biuro programos čia neužsirakins. Dirbtuvėse palikite nepažymėtą — tada užsirakina po 10 min. be veiklos.';
  lbl.querySelector('input').addEventListener('change',function(e){
    try{if(e.target.checked){localStorage.setItem(PC,'1');}else{localStorage.removeItem(PC);}localStorage.setItem(IDLE,String(Date.now()));}catch(_){}
    decorate();
  });
  function add(){document.body.appendChild(lbl);decorate();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
</body>
