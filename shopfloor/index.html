<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1620">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230e1620'/%3E%3Cpath d='M15 12h18v22H15zM24 12v13M15 25h18M15 30h18' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<title>Dėdės Baldai Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style id="hub-css">
/* Layout: header with clock → stage filter + search → one grid of large touch tiles, tinted by shopfloor stage */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f7f8fa; --ink:#0e1620; --muted:#5f6b77; --line:#e1e6ea; --line-strong:#c9d1d8;
  --shadow:0 1px 2px rgba(14,22,32,.05),0 8px 24px -12px rgba(14,22,32,.18);
  --shadow-hi:0 2px 4px rgba(14,22,32,.06),0 18px 40px -16px rgba(14,22,32,.28);
  --design:#2f63e8; --design-soft:#e7eefe;
  --cnc:#c98a00; --cnc-soft:#fdf2d4;
  --prod:#14875b; --prod-soft:#dff3ea;
  --focus:#2f63e8; --danger:#c33b2e;
  --f-ui:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --surface:#131a22; --surface-2:#18212b; --ink:#eef2f5; --muted:#8d9aa6; --line:#222c37; --line-strong:#33404d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.75);
  --design:#7ea2ff; --design-soft:#1a2645;
  --cnc:#f5bd2c; --cnc-soft:#33280b;
  --prod:#4fcf97; --prod-soft:#12301f;
  --focus:#7ea2ff; --danger:#ff7a6b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#131a22; --surface-2:#18212b; --ink:#eef2f5; --muted:#8d9aa6; --line:#222c37; --line-strong:#33404d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.75);
  --design:#7ea2ff; --design-soft:#1a2645;
  --cnc:#f5bd2c; --cnc-soft:#33280b;
  --prod:#4fcf97; --prod-soft:#12301f;
  --focus:#7ea2ff; --danger:#ff7a6b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:52px;height:52px;flex:none;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.mark svg{width:30px;height:30px}
.brand h1{margin:0;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:15px}
.right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{text-align:right;line-height:1.1}
.clock b{display:block;font-weight:600;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:13px}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;transition:background .15s,border-color .15s}
.pill:hover{border-color:var(--line-strong)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-pressed="true"] .n{color:inherit;opacity:.7}
.search{position:relative;flex:0 1 300px;min-width:0}
.search input{width:100%;font:inherit;font-size:15px;min-height:44px;padding:10px 44px 10px 42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface-2)}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-weight:600;font-size:14px;min-height:40px;padding:9px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{--tint:var(--muted);--tint-soft:var(--surface-2);position:relative;display:flex;flex-direction:column;gap:16px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;min-width:0;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile[data-g="design"]{--tint:var(--design);--tint-soft:var(--design-soft)}
.tile[data-g="cnc"]{--tint:var(--cnc);--tint-soft:var(--cnc-soft)}
.tile[data-g="production"]{--tint:var(--prod);--tint-soft:var(--prod-soft)}
a.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--tint)}
a.tile:active{transform:translateY(-1px) scale(.995)}
a.tile:hover .arrow{background:var(--tint);color:var(--surface);transform:translateX(2px)}
.tile.missing{box-shadow:none;background:transparent;border-style:dashed;border-color:var(--line-strong)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--tint-soft);color:var(--tint)}
.missing .ico{filter:grayscale(1);opacity:.6}
.ico svg{width:30px;height:30px}
.key{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px;background:var(--surface-2)}
.tile h3{margin:0;font-weight:600;font-size:23px;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.tile p.desc{margin:6px 0 0;color:var(--muted);font-size:15px}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;min-width:0}
.stage{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--tint);flex:none}
.stage em{font-style:normal;padding:2px 8px;border-radius:999px;background:var(--tint-soft);color:var(--tint);font-size:12px;font-weight:600}
.arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none;transition:background .18s,color .18s,transform .18s}
.arrow svg{width:18px;height:18px}
.missing .note{font-size:13px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:18px}

.tile.edit{gap:10px}
.tile.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.tile.edit input,.tile.edit select{font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.tile.edit input.url{font-family:var(--f-mono);font-size:13px}
.tile.edit .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.add-tile{display:grid;place-items:center;min-height:180px;border:1.5px dashed var(--line-strong);border-radius:18px;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.add-tile:hover{border-color:var(--ink);color:var(--ink)}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 20px;background:var(--ink);color:var(--bg);border-radius:999px;box-shadow:var(--shadow-hi)}
.savebar .btn{border-color:var(--bg);background:transparent;color:var(--bg)}
.savebar .btn.primary{background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow-hi)}
footer.foot{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-top:4px}
@media (max-width:640px){.brand h1{font-size:22px}.clock b{font-size:24px}.search{flex:1 1 100%}.grid{grid-template-columns:1fr}.key{display:none}.savebar{border-radius:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<script type="application/json" id="hub-data">{"base":"https://gervdalius-droid.github.io/","apps":[
{"id":"builder","code":"DB-01","group":"design","icon":"cabinet","url":"https://gervdalius-droid.github.io/builder/","name":{"lt":"Spintelių kūrėjas","en":"Cabinet Studio"},"desc":{"lt":"Spintelė → detalių sąrašas ir CNC operacijos be inžinieriaus","en":"Cabinet settings → part list and CNC ops, no engineer"}},
{"id":"braizykle","code":"DB-02","group":"design","icon":"compass","url":"https://gervdalius-droid.github.io/cad/","name":{"lt":"Braižyklė","en":"Braižyklė"},"desc":{"lt":"Brėžinių braižymas naršyklėje","en":"Drafting in the browser"}},
{"id":"draft","code":"DB-03","group":"design","icon":"dxf","url":"https://gervdalius-droid.github.io/cad/draft.html","name":{"lt":"DXF redaktorius","en":"DXF Editor"},"desc":{"lt":"DXF importas, matmenys, nuožulos, detalių perkėlimas lapuose","en":"Import DXF, resize, chamfer, move parts on sheets"},"tag":{"lt":"Draft v3","en":"Draft v3"}},

{"id":"shopflow","code":"DB-06","group":"production","icon":"track","url":"https://gervdalius-droid.github.io/shopflow-app/","name":{"lt":"ShopFlow","en":"ShopFlow"},"desc":{"lt":"Gamybos sekimas dirbtuvėse","en":"Workshop production tracking"}}
]}</script>
<script id="hub-main">
(function(){
var DATA = JSON.parse(document.getElementById('hub-data').textContent);
var GROUPS = [
  {id:'design',lt:'Projektavimas',en:'Design'},
  {id:'cnc',lt:'CNC paruošimas',en:'CNC prep'},
  {id:'production',lt:'Gamyba',en:'Production'}
];
var ICONS = {
  cabinet:'<path d="M4 3h16v18H4zM12 3v11M4 14h16M4 17.5h16M10 8.5v1.5M14 8.5v1.5M11 15.75h2M11 19.25h2"/>',
  compass:'<circle cx="12" cy="4.5" r="1.5"/><path d="M11.3 6 6 21M12.7 6 18 21M8 16h8"/>',
  dxf:'<path d="M5 18 10 6l9 4-3 8z"/><rect x="3.5" y="16.5" width="3" height="3"/><rect x="8.5" y="4.5" width="3" height="3"/><rect x="17.5" y="8.5" width="3" height="3"/><rect x="14.5" y="16.5" width="3" height="3"/>',
  nest:'<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 12h9M12 4v16M12 9h9M7.5 12v8M12 15h5v5"/>',
  code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5.5l-3 13"/>',
  track:'<path d="M4 6l1.5 1.5L8 5M11 6h9M4 12l1.5 1.5L8 11M11 12h9M11 18h9"/><circle cx="6" cy="18" r="1.6"/>',
  generic:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M12 8v8"/>'
};
var T = {
  lt:{sub:'Dirbtuvių programos',all:'Visos',search:'Ieškoti programos…',edit:'Redaguoti',save:'Išsaugoti',cancel:'Atšaukti',missing:'Nuoroda dar nepridėta',name:'Pavadinimas',desc:'Aprašymas',url:'Nuoroda (URL)',group:'Etapas',del:'Pašalinti',add:'+ Pridėti programą',editing:'Pakeitimai matomi visiems, kai išsaugosite',saving:'Saugoma…',saved:'Išsaugota',fail:'Nepavyko išsaugoti. Bandykite dar kartą.',ro:'Šį puslapį gali keisti tik savininkas.',nomatch:'Nieko nerasta',foot:'Spauskite skaičių klaviatūroje, kad atidarytumėte programą',newapp:'Nauja programa',conflict:'Kažkas išsaugojo tuo pačiu metu. Puslapis atnaujintas.',locale:'lt-LT'},
  en:{sub:'Workshop apps',all:'All',search:'Find an app…',edit:'Edit',save:'Save',cancel:'Cancel',missing:'Link not added yet',name:'Name',desc:'Description',url:'Link (URL)',group:'Stage',del:'Remove',add:'+ Add app',editing:'Everyone sees the changes once you save',saving:'Saving…',saved:'Saved',fail:'Could not save. Try again.',ro:'Only the owner can change this page.',nomatch:'No matches',foot:'Press a number key to open an app',newapp:'New app',conflict:'Someone saved at the same time. The page has been refreshed.',locale:'en-GB'}
};
var lang = 'lt', q = '', filter = 'all', editing = false, draft = null, canEdit = false, artifactNs = null;
try { var l = localStorage.getItem('hub-lang'); if (l === 'en' || l === 'lt') lang = l; var f = localStorage.getItem('hub-filter'); if (f) filter = f; } catch(e){}
if (filter !== 'all' && !GROUPS.some(function(g){return g.id===filter;})) filter = 'all';
var app = document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function svg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.generic)+'</svg>';}
function txt(o){return o ? (o[lang] || o.lt || o.en || '') : '';}
function t(k){return T[lang][k];}
function gname(id){var g = GROUPS.filter(function(x){return x.id===id;})[0]; return g ? g[lang] : '';}
function ordered(list){var o={}; GROUPS.forEach(function(g,i){o[g.id]=i;}); return list.map(function(a,i){return [a,i];}).sort(function(x,y){return ((o[x[0].group]||0)-(o[y[0].group]||0)) || (x[1]-y[1]);});}
var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function visible(){
  var needle = q.trim().toLowerCase();
  return ordered(DATA.apps).map(function(p){return p[0];}).filter(function(a){
    if (filter !== 'all' && a.group !== filter) return false;
    if (!needle) return true;
    return (txt(a.name)+' '+(a.name&&a.name.en||'')+' '+txt(a.desc)+' '+(a.url||'')).toLowerCase().indexOf(needle) >= 0;
  });
}
function tileView(a, n){
  var tag = a.tag ? '<em>'+esc(txt(a.tag))+'</em>' : '';
  var inner = '<div class="tile-top"><div class="ico">'+svg(a.icon)+'</div>'+(a.url && n<=9 ? '<span class="key" aria-hidden="true">'+n+'</span>' : '')+'</div>'+
    '<div><h3>'+esc(txt(a.name))+'</h3><p class="desc">'+esc(txt(a.desc))+'</p></div>';
  if (a.url) return '<a class="tile" data-g="'+esc(a.group)+'" href="'+esc(a.url)+'" target="_blank" rel="noopener" data-key="'+n+'">'+inner+
    '<div class="tile-foot"><span class="stage"><i></i>'+esc(gname(a.group))+tag+'</span><span class="arrow">'+ARROW+'</span></div></a>';
  return '<div class="tile missing" data-g="'+esc(a.group)+'">'+inner+'<div class="tile-foot"><span class="note">'+t('missing')+'</span></div></div>';
}
function tileEdit(a, i){
  var opts = GROUPS.map(function(g){return '<option value="'+g.id+'"'+(g.id===a.group?' selected':'')+'>'+esc(g[lang])+'</option>';}).join('');
  return '<div class="tile edit" data-g="'+esc(a.group)+'" data-i="'+i+'"><div class="tile-top"><div class="ico">'+svg(a.icon)+'</div></div>'+
    '<label>'+t('name')+'<input id="n-'+esc(a.id)+'" data-f="name" value="'+esc(txt(a.name))+'"></label>'+
    '<label>'+t('desc')+'<input id="d-'+esc(a.id)+'" data-f="desc" value="'+esc(txt(a.desc))+'"></label>'+
    '<label>'+t('url')+'<input class="url" id="u-'+esc(a.id)+'" data-f="url" type="url" placeholder="https://…" value="'+esc(a.url)+'"></label>'+
    '<div class="row"><label style="flex:1">'+t('group')+'<select id="g-'+esc(a.id)+'" data-f="group">'+opts+'</select></label>'+
    '<button class="btn ghost danger" data-del="'+i+'" type="button">'+t('del')+'</button></div></div>';
}
function clockHTML(){
  var d = new Date();
  var time = d.toLocaleTimeString(t('locale'),{hour:'2-digit',minute:'2-digit'});
  var date = d.toLocaleDateString(t('locale'),{weekday:'long',month:'long',day:'numeric'});
  date = date.charAt(0).toUpperCase() + date.slice(1);
  return '<b>'+esc(time)+'</b><span>'+esc(date)+'</span>';
}

function render(){
  var h = '<div class="wrap"><header class="top"><div class="brand">'+
    '<div class="mark"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="6" width="30" height="34" rx="2"/><path d="M24 6v21M9 27h30M9 33.5h30M19 15v4M29 15v4M22 30.25h4M22 36.75h4M13 40v3M35 40v3"/></svg></div>'+
    '<div><h1>Dėdės Baldai</h1><p>'+t('sub')+'</p></div></div>'+
    '<div class="right"><div class="clock" id="clock">'+clockHTML()+'</div>'+
    '<div class="seg" role="group" aria-label="Language"><button type="button" data-lang="lt" aria-pressed="'+(lang==='lt')+'">LT</button><button type="button" data-lang="en" aria-pressed="'+(lang==='en')+'">EN</button></div>'+
    (canEdit && !editing ? '<button class="btn" id="btn-edit" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'+t('edit')+'</button>' : '')+
    '</div></header>';
  if (editing) {
    h += '<div class="grid">'+ordered(draft).map(function(p){return tileEdit(p[0], p[1]);}).join('')+'<button class="add-tile" type="button" data-add="1">'+t('add')+'</button></div>';
    h += '<div class="savebar"><span>'+t('editing')+'</span><span style="display:flex;gap:8px"><button class="btn ghost" id="btn-cancel" type="button">'+t('cancel')+'</button><button class="btn primary" id="btn-save" type="button">'+t('save')+'</button></span></div>';
  } else {
    var counts = {all: DATA.apps.length}; DATA.apps.forEach(function(a){counts[a.group]=(counts[a.group]||0)+1;});
    h += '<div class="bar"><div class="pills" role="group" aria-label="'+(lang==='lt'?'Etapas':'Stage')+'">'+
      '<button type="button" class="pill" data-filter="all" aria-pressed="'+(filter==='all')+'">'+t('all')+' <span class="n">'+counts.all+'</span></button>'+
      GROUPS.filter(function(g){return counts[g.id];}).map(function(g){
        var c = g.id==='design'?'var(--design)':g.id==='cnc'?'var(--cnc)':'var(--prod)';
        return '<button type="button" class="pill" data-filter="'+g.id+'" aria-pressed="'+(filter===g.id)+'"><span class="dot" style="background:'+c+'"></span>'+esc(g[lang])+' <span class="n">'+counts[g.id]+'</span></button>';
      }).join('')+'</div>'+
      '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>'+
      '<input id="hub-search" type="search" autocomplete="off" placeholder="'+t('search')+'" value="'+esc(q)+'"><kbd>/</kbd></div></div>';
    var list = visible(), n = 0;
    h += list.length ? '<div class="grid">'+list.map(function(a){ if (a.url) n++; return tileView(a, a.url ? n : 0); }).join('')+'</div>'
                     : '<div class="empty">'+t('nomatch')+'</div>';
  }
  h += '<footer class="foot"><span>'+t('foot')+'</span><span>Dėdės Baldai · Vilnius</span></footer></div>';
  app.innerHTML = h;
}

function toast(msg, ms){
  var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(function(){el.remove();}, ms || 2600);
}
function readDraftInputs(){
  app.querySelectorAll('.tile.edit').forEach(function(card){
    var a = draft[+card.getAttribute('data-i')]; if (!a) return;
    card.querySelectorAll('[data-f]').forEach(function(inp){
      var f = inp.getAttribute('data-f'), v = inp.value.trim();
      if (f === 'name' || f === 'desc') { a[f] = a[f] || {}; a[f][lang] = v; if (!a[f].lt) a[f].lt = v; if (!a[f].en) a[f].en = v; }
      else if (f === 'url') { a.url = v && !/^https?:\/\//i.test(v) ? 'https://' + v : v; }
      else a[f] = v;
    });
  });
}
function buildDocument(state){
  var reset = (document.head.querySelector('style') || {}).textContent || '';
  var css = document.getElementById('hub-css').textContent;
  var js = document.getElementById('hub-main').textContent;
  var json = JSON.stringify(state).replace(/</g,'\\u003c');
  var S = 'script';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Dėdės Baldai Hub</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">\n'+
    '<style id="hub-css">'+css+'</style>\n<div id="app"></div>\n'+
    '<'+S+' type="application/json" id="hub-data">'+json+'</'+S+'>\n'+
    '<'+S+' id="hub-main">'+js+'</'+S+'>\n</body></html>';
}
async function save(){
  readDraftInputs();
  var btn = document.getElementById('btn-save'); if (btn) { btn.disabled = true; btn.textContent = t('saving'); }
  var next = {base: DATA.base, apps: draft.filter(function(a){ return txt(a.name); })};
  try {
    if (!artifactNs) throw {code:'not_granted'};
    await artifactNs.publish(buildDocument(next));
    DATA = next; editing = false; draft = null; render(); toast(t('saved'));
  } catch (e) {
    var code = e && e.code;
    if (code === 'conflict') { toast(t('conflict'), 4000); return; }
    toast(code === 'not_granted' || code === 'not_writer' ? t('ro') : t('fail'), 4000);
    if (btn) { btn.disabled = false; btn.textContent = t('save'); }
  }
}

app.addEventListener('click', function(e){
  var el = e.target.closest('button'); if (!el) return;
  if (el.dataset.lang) { if (editing) readDraftInputs(); lang = el.dataset.lang; try{localStorage.setItem('hub-lang',lang);}catch(_){} render(); return; }
  if (el.dataset.filter) { filter = el.dataset.filter; try{localStorage.setItem('hub-filter',filter);}catch(_){} render(); return; }
  if (el.id === 'btn-edit') { editing = true; q = ''; draft = JSON.parse(JSON.stringify(DATA.apps)); render(); return; }
  if (el.id === 'btn-cancel') { editing = false; draft = null; render(); return; }
  if (el.id === 'btn-save') { save(); return; }
  if (el.dataset.del != null) { readDraftInputs(); draft.splice(+el.dataset.del, 1); render(); return; }
  if (el.dataset.add) {
    readDraftInputs();
    var n = 1; draft.forEach(function(a){ var m = /DB-(\d+)/.exec(a.code||''); if (m) n = Math.max(n, +m[1] + 1); });
    var id = 'app' + Date.now().toString(36);
    draft.push({id:id, code:'DB-'+String(n).padStart(2,'0'), group:filter!=='all'?filter:'production', icon:'generic', url:'', name:{lt:T.lt.newapp,en:T.en.newapp}, desc:{lt:'',en:''}});
    render(); var inp = document.getElementById('n-'+id); if (inp) { inp.focus(); inp.select(); }
  }
});
app.addEventListener('input', function(e){
  if (e.target.id === 'hub-search') { q = e.target.value; var pos = e.target.selectionStart; render(); var s = document.getElementById('hub-search'); s.focus(); try{s.setSelectionRange(pos,pos);}catch(_){} }
});
app.addEventListener('keydown', function(e){
  if (e.target.id === 'hub-search' && e.key === 'Enter') { var first = app.querySelector('a.tile'); if (first) first.click(); }
  if (e.target.id === 'hub-search' && e.key === 'Escape') { q = ''; render(); document.getElementById('hub-search').focus(); }
});
document.addEventListener('keydown', function(e){
  if (editing || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = document.activeElement && document.activeElement.tagName;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if (e.key === '/') { e.preventDefault(); var s = document.getElementById('hub-search'); if (s) s.focus(); return; }
  if (/^[1-9]$/.test(e.key)) { var a = app.querySelector('a.tile[data-key="'+e.key+'"]'); if (a) { e.preventDefault(); a.click(); } }
});
setInterval(function(){ var c = document.getElementById('clock'); if (c) c.innerHTML = clockHTML(); }, 15000);

render();

if (window.claude && window.claude.use) {
  Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
    var user = r[0]; artifactNs = r[1];
    if (!user || !artifactNs) return;
    return Promise.resolve(user.canEdit()).then(function(ok){ canEdit = !!ok; if (canEdit && !editing) render(); });
  }).catch(function(){});
}
})();
</script>
</body>
</html>
