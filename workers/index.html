<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Darbuotojai</title>
<style>
:root{--bg:#e6e8e3;--surface:#f8f9f6;--surface-2:#eef0ec;--ink:#131715;--muted:#59615b;--line:#d2d7cf;--accent:#ff4a1c;--ok:#2c6b3c;--bad:#a83226}
@media (prefers-color-scheme:dark){:root{--bg:#0f1211;--surface:#191d1b;--surface-2:#141816;--ink:#e9ede8;--muted:#8e9890;--line:#2a302c;--accent:#ff6b3d;--ok:#6fbf83;--bad:#e2786b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
.me{color:var(--muted);font-size:13px}
.me button{margin-left:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
form.add{display:grid;grid-template-columns:1fr 130px 130px auto;gap:8px;align-items:end}
@media (max-width:560px){form.add{grid-template-columns:1fr 1fr}form.add button{grid-column:1/-1}}
label{display:block;font-size:12px;color:var(--muted)}
input,select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.small{padding:5px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
td.act{text-align:right;white-space:nowrap}
td.act button{margin-left:4px}
.off td:not(.act){opacity:.45}
.tag{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.msg{min-height:20px;font-size:13px;margin-top:10px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.note{color:var(--muted);font-size:13px;margin:0}
</style>
</head>
<body>
<main>
  <header>
    <h1>Darbuotojai</h1>
    <span class="me" id="me"></span>
  </header>

  <section class="card" id="addCard" hidden>
    <h2>Naujas darbuotojas</h2>
    <form class="add" id="add" autocomplete="off">
      <label>Vardas<input name="name" required placeholder="pvz. Jonas"></label>
      <label>PIN (6 skaitm.)<input name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <label>Rolė<select name="role"><option value="worker">Darbuotojas (dirbtuvės programos)</option><option value="manager">Biuras (visos programos)</option><option value="admin">Administratorius</option><option value="shop">Dirbtuvės planšetė</option></select></label>
      <button class="primary" type="submit">Pridėti</button>
    </form>
    <div class="msg" id="addMsg"></div>
  </section>

  <section class="card" id="listCard" hidden>
    <h2>Sąrašas</h2>
    <table><thead><tr><th>Vardas</th><th>Rolė</th><th>Būsena</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="msg" id="listMsg"></div>
  </section>

  <p class="note" id="info">Prisijungimas tuo pačiu vardu ir PIN veikia visose programose. Pasiūlymai, Prašymai, CRM ir Sąskaitos atsidaro rolėms „Biuras“ ir „Administratorius“. Užblokuotas darbuotojas iškart netenka prieigos visur.</p>
</main>

<script src="workshop-auth.js"></script>
<script>
(function () {
  "use strict";
  var W = WorkshopAuth, $ = function (id) { return document.getElementById(id); };
  var ROLE = { worker: "Darbuotojas", manager: "Biuras", admin: "Administratorius", shop: "Dirbtuvės planšetė" };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function msg(el, text, bad) { el.textContent = text || ""; el.className = "msg" + (text ? (bad ? " bad" : " ok") : ""); }

  function call(body) {
    return W.token().then(function (tok) {
      if (!tok) throw new Error("Prisijunkite iš naujo");
      return fetch(W.cfg.url + "/functions/v1/workshop-admin", {
        method: "POST", headers: W.headers(tok), body: JSON.stringify(body)
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
        return d;
      });
    });
  }

  function load() {
    return call({ action: "list" }).then(function (d) {
      var rows = (d.members || []).map(function (m) {
        return '<tr class="' + (m.active ? "" : "off") + '" data-id="' + esc(m.user_id) + '">' +
          "<td>" + esc(m.display_name) + "</td>" +
          '<td><span class="tag">' + esc(ROLE[m.role] || m.role) + "</span></td>" +
          "<td>" + (m.active ? "Aktyvus" : "Užblokuotas") + "</td>" +
          '<td class="act"><button class="small" data-a="pin">Naujas PIN</button>' +
          '<button class="small" data-a="active" data-v="' + (m.active ? "0" : "1") + '">' + (m.active ? "Blokuoti" : "Atblokuoti") + "</button></td></tr>";
      });
      $("rows").innerHTML = rows.join("") || '<tr><td colspan="4" class="note">Dar nėra darbuotojų.</td></tr>';
    }, function (e) { msg($("listMsg"), e.message, true); });
  }

  $("add").onsubmit = function (ev) {
    ev.preventDefault();
    var f = ev.target, b = f.querySelector("button");
    b.disabled = true; msg($("addMsg"), "");
    call({ action: "create", name: f.elements.name.value, pin: f.elements.pin.value, role: f.elements.role.value })
      .then(function () { msg($("addMsg"), "Pridėta: " + f.elements.name.value + ". Prisijungimas: vardas + PIN."); f.reset(); return load(); },
            function (e) { msg($("addMsg"), e.message, true); })
      .then(function () { b.disabled = false; });
  };

  $("rows").onclick = function (ev) {
    var b = ev.target.closest("button[data-a]"); if (!b) return;
    var id = b.closest("tr").getAttribute("data-id"), name = b.closest("tr").firstChild.textContent;
    var body;
    if (b.getAttribute("data-a") === "pin") {
      var pin = prompt("Naujas 6 skaitmenų PIN darbuotojui " + name + ":");
      if (!pin) return;
      body = { action: "pin", user_id: id, pin: pin.trim() };
    } else {
      var on = b.getAttribute("data-v") === "1";
      if (!on && !confirm("Užblokuoti " + name + "? Prieiga visose programose bus nutraukta.")) return;
      body = { action: "active", user_id: id, active: on };
    }
    b.disabled = true;
    call(body).then(function () { msg($("listMsg"), "Išsaugota."); return load(); }, function (e) { msg($("listMsg"), e.message, true); })
      .then(function () { b.disabled = false; });
  };

  function start(me) {
    if (!me) { $("me").textContent = ""; $("info").textContent = "Prisijunkite, kad tvarkytumėte darbuotojus."; return W.gate({ title: "Darbuotojų tvarkymas" }).then(start); }
    $("me").innerHTML = esc(me.display_name) + ' <button class="small" id="out">Atsijungti</button>';
    $("out").onclick = function () { W.logout(); location.reload(); };
    if (me.role !== "admin") { $("info").textContent = "Šis puslapis skirtas tik administratoriams."; return; }
    $("addCard").hidden = false; $("listCard").hidden = false;
    return load();
  }
  (W.signedIn() ? W.me() : Promise.resolve(null)).then(start);
})();
</script>
</body>
</html>
